plugins { id 'com.android.application' }
android {
    namespace 'dev.dualapp.packloader'
    compileSdk 35
    ndkVersion "29.0.13846066"
    defaultConfig {
        applicationId 'dev.dualapp.packloader'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1"
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}
